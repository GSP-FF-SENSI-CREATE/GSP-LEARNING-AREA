<h3>📚 मित्रता – विस्तृत अध्ययन</h3>
<p><b>लेखक:</b> आचार्य रामचन्द्र शुक्ल</p>
<p><b>विधा:</b> विचारात्मक एवं भावात्मक निबंध</p>
<h4>1. पाठ का परिचय</h4>
<p>‘मित्रता’ निबंध में लेखक ने सच्ची मित्रता, मित्र के चुनाव, अच्छी और बुरी संगति तथा मनुष्य के चरित्र पर मित्रों के प्रभाव का विवेचन किया है। लेखक के अनुसार मित्रता केवल साथ घूमने या बातचीत करने का नाम नहीं है। सच्चा मित्र वह है जो हमारे हित की चिंता करे और आवश्यकता पड़ने पर हमें गलत कार्य से रोके।</p>
<h4>2. मित्र चुनने का महत्व</h4>
<p>मनुष्य सामाजिक प्राणी है। जीवन में उसे अनेक लोगों से मिलना-जुलना पड़ता है। सभी परिचित व्यक्ति सच्चे मित्र नहीं होते। इसलिए मित्र बनाते समय उसके स्वभाव, विचारों और आचरण को समझना चाहिए।</p>
<h4>3. संगति का प्रभाव</h4>
<p>मनुष्य जिन लोगों के साथ अधिक समय बिताता है, उनके विचारों और आदतों का प्रभाव उस पर पड़ता है। अच्छी संगति व्यक्ति को सदाचार, परिश्रम और उन्नति की ओर प्रेरित करती है। बुरी संगति धीरे-धीरे विवेक और चरित्र को कमजोर कर सकती है।</p>
<h4>4. सच्चे मित्र के गुण</h4>
<ul>
<li>वह हमारे हित की बात सोचता है।</li>

let classNo=10,subjectNo=0,lessonName="",groupName="";
const pages=["home","subjectsPage","lessonsPage","studyPage"];
function page(id){pages.forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");window.scrollTo(0,0)}
function home(){page("home")}
function subjects(){page("subjectsPage")}
function lessons(){page("lessonsPage")}

function renderClasses(){
  
 const names=[9,10,11,12];

 document.getElementById("classGrid").innerHTML=names.map(n=>`
  <div class="card" onclick="openClass(${n})">
   <div class="emoji">📘</div>
   <h3>Class ${n}th</h3>
   <p class="muted">UP Board • विषय देखें</p>
  </div>
 `).join("");
}

function openClass(n){
 classNo=n;
 document.getElementById("classTitle").textContent="Class "+n+"th - UP Board";

 const list=curriculum[n]||[];
 const msg=document.getElementById("classMessage");
 const grid=document.getElementById("subjectGrid");

 if(!list.length){
  msg.innerHTML="इस कक्षा की विषय-सूची अभी जोड़ी नहीं गई है।";
  grid.innerHTML="";
 }else{
  msg.innerHTML="अपना विषय चुनें।";
  grid.innerHTML=list.map((s,i)=>`
   <div class="card" onclick="openSubject(${i})">
    <div class="emoji">${s[1]}</div>
    <h3>${s[0]}</h3>
    <p class="muted">${s[2].reduce((a,g)=>a+g[1].length,0)} पाठ / अध्याय</p>
   </div>
  `).join("");
 }
 page("subjectsPage");
}

function openSubject(i){
 subjectNo=i;
 const subject=curriculum[classNo][i];

 document.getElementById("subjectTitle").textContent=subject[0];
 document.getElementById("search").value="";

 renderLessons();
 page("lessonsPage");
}

function renderLessons(){
 const filter=document.getElementById("search").value.toLowerCase();
 let html="",n=0;

 curriculum[classNo][subjectNo][2].forEach(group=>{
  const matching=group[1].filter(x=>x.toLowerCase().includes(filter));

  if(!matching.length)return;

  html+=`<div style="grid-column:1/-1"><h2>${group[0]}</h2></div>`;

  matching.forEach(name=>{
   n++;
   html+=`
    <div class="lesson" onclick="openLesson('${esc(group[0])}','${esc(name)}')">
     <div class="num">${n}</div>
     <div>
      <b>${name}</b>
      <p class="muted">अध्याय खोलें →</p>
     </div>
    </div>
   `;
  });
 });

 document.getElementById("lessonGrid").innerHTML=html||"कोई अध्याय नहीं मिला।";
}

function esc(s){
 return String(s)
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#39;");
}

function openLesson(g,n){
 groupName=g;
 lessonName=n;

 document.getElementById("lessonTitle").textContent=n;

 document.getElementById("lessonInfo").textContent=
 "Class "+classNo+" • "+
 curriculum[classNo][subjectNo][0]+" • "+g;

 document.querySelectorAll(".tab").forEach((b,i)=>{
  b.classList.toggle("active",i===0);
 });

 tab("theory",document.querySelector(".tab"));
 page("studyPage");
}

   </div>
  `;
  return;
 }

 if(which==="mcq"){
  showQuiz();
  return;
 }

 content.innerHTML=mitrata[which]||
 "<p>सामग्री उपलब्ध नहीं है।</p>";
}

/* =========================
   MCQ QUIZ SYSTEM
========================= */

let qIndex=0;
let score=0;
let locked=false;

function showQuiz(){
 qIndex=0;
 score=0;
 locked=false;
 drawQuestion();
}

function drawQuestion(){
 const box=document.getElementById("studyContent");

 if(qIndex>=mitrata.mcq.length){
  box.innerHTML=`
   <h3>🏆 Quiz Result</h3>
   <h2>आपका स्कोर: ${score} / ${mitrata.mcq.length}</h2>
   <p>${score>=8?
    "बहुत अच्छा! आपकी तैयारी अच्छी है।":
    score>=5?
    "अच्छा प्रयास! एक बार फिर अभ्यास करें।":
    "अध्याय के Notes दोबारा पढ़ें और फिर प्रयास करें।"
   }</p>

   <button onclick="showQuiz()">दोबारा Quiz दें</button>

   <h3 style="margin-top:22px">उत्तर जाँच</h3>

   ${mitrata.mcq.map((q,i)=>`
    <div class="answer">
     <b>${i+1}. ${q.q}</b><br>
     सही उत्तर: ${q.o[q.a]}<br>
     <small>${q.e}</small>
    </div>
   `).join("")}
  `;
  return;
 }

 const q=mitrata.mcq[qIndex];

 box.innerHTML=`
  <h3>📝 MCQ Quiz</h3>
  <p class="muted">प्रश्न ${qIndex+1} / ${mitrata.mcq.length} • स्कोर ${score}</p>

  <h3 style="color:white">${q.q}</h3>

  <div id="options">
   ${q.o.map((x,i)=>`
    <button class="option" onclick="choose(${i})">
     ${"ABCD"[i]}. ${x}
    </button>
   `).join("")}
  </div>

  <div id="feedback"></div>

  <button id="nextBtn" class="hidden" onclick="nextQ()">
   अगला प्रश्न →
  </button>
 `;
}

function choose(i){
 if(locked)return;

 locked=true;

 const q=mitrata.mcq[qIndex];

 document.querySelectorAll("#options button").forEach((b,j)=>{
  b.disabled=true;

  if(j===q.a)b.classList.add("correct");
  else if(j===i)b.classList.add("wrong");
 });

 if(i===q.a)score++;

 document.getElementById("feedback").innerHTML=`
  <div id="quizResult">
   <b>${i===q.a?"✅ सही उत्तर!":"❌ गलत उत्तर"}</b>
   <br>${q.e}
  </div>
 `;

 document.getElementById("nextBtn").classList.remove("hidden");
}

function nextQ(){
 qIndex++;
 locked=false;
 drawQuestion();
}

/* =========================
   START WEBSITE
========================= */

renderClasses();
page("home");

</script>
</body>
</html>
